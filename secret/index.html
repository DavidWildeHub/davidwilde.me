<body>
<div id="weather"></div>

<script>
fetch("https://api.weather.gov/gridpoints/AKQ/36,76/forecast")
  .then(response => response.json())
  .then(data => {
    document.getElementById("weather").innerHTML =
      data.properties.periods[0].temperature + "°F";
  });
</script>
