<!-- Placeholder page: its only job is proving GitHub Pages serves /secret/
     (a folder needs an index.html to resolve without a filename in the URL).
     The real content lives in secret.html, linked from the homepage. -->
<h1>
    index file test for /secret
</h1>
<body>
<div id="weather"></div>

<script>
  // Same weather-fetch idea as index.html: call the NWS forecast API and
  // show the current temperature and wind speed once the response arrives.
  fetch("https://api.weather.gov/gridpoints/AKQ/36,76/forecast").then(response => response.json()).then(data => { document.getElementById("weather").innerHTML = data.properties.periods[0].temperature + "°F, Wind: "+ data.properties.periods[0].windSpeed;});
</script>

</body>
